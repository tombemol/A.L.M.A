services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alma
      POSTGRES_USER: alma
      POSTGRES_PASSWORD: alma_dev
    ports:
      - "5432:5432"
    volumes:
      - alma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alma -d alma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alma_postgres_data:
